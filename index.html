<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Calogen Italic";src:url("fonts/calogen-bold-italic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"Calogen Exp";src:url("fonts/calogen-exp-italic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
:root{--ink:#0d0d0c;--bone:#ece7de;--muted:#a39d92;--dim:#6a665e;--s1:#e8692c;--s2:#f2a33a;--s3:#f4e2c6;--sans:"Hanken Grotesk",system-ui,sans-serif;--display:"Calogen Italic","Hanken Grotesk",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--bone);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#c-top{cursor:grab}
#c-top.drag{cursor:grabbing}
#c-top.hover{cursor:pointer}
button{font-family:inherit;color:inherit}

/* Vignette and grain */
.vig{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(13,13,12,.9) 0,rgba(13,13,12,.78) 24%,rgba(13,13,12,.4) 36%,transparent 46%),linear-gradient(to top,rgba(13,13,12,.85),transparent 22%),radial-gradient(ellipse at 60% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
@media (max-width:760px){.vig{background:linear-gradient(to bottom,rgba(13,13,12,.94) 0,rgba(13,13,12,.82) 30%,rgba(13,13,12,.4) 40%,transparent 48%),linear-gradient(to top,rgba(13,13,12,.94) 10%,transparent 32%)}}

/* Top left: wordmark + headline */
.hud{position:fixed;left:32px;top:34px;max-width:min(520px,calc(100vw - 64px));pointer-events:none;z-index:5}
.wm{font-family:"Calogen Exp",var(--display);font-weight:700;font-style:italic;font-size:1.05rem;letter-spacing:.01em;color:var(--bone);pointer-events:auto;text-decoration:none}
.hud h1{font-family:var(--display);font-weight:700;font-style:italic;font-size:clamp(2.1rem,4.6vw,3.9rem);line-height:.98;letter-spacing:-.005em;margin-top:22px;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.hud .sum{margin-top:16px;font-size:1.04rem;line-height:1.5;color:#d8d2c7;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.8);max-width:44ch}
.hud .stats{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap}
.hud .stat b{display:block;font-weight:600;font-size:1.5rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hud .stat span{font-size:.8rem;color:#b5afa4}
.hud .stat b,.hud .stat span,.ticker button,.ticker .lbl,.legend{text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.7)}

/* Ticker */
.ticker{position:fixed;left:32px;bottom:92px;max-width:min(460px,calc(100vw - 64px));z-index:5;pointer-events:auto}
.ticker .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.ticker .lbl i{width:6px;height:6px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 0 rgba(232,105,44,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,105,44,.6)}70%{box-shadow:0 0 0 10px rgba(232,105,44,0)}100%{box-shadow:0 0 0 0 rgba(232,105,44,0)}}
.ticker button{display:block;text-align:left;background:none;border:0;cursor:pointer;margin-top:8px;font-size:1.12rem;line-height:1.4;color:var(--bone);text-shadow:0 1px 16px rgba(0,0,0,.9);transition:opacity .5s,transform .5s}
.ticker button.out{opacity:0;transform:translateY(6px)}
.ticker button:hover u{text-decoration-color:var(--s1)}
.ticker u{text-decoration:underline;text-decoration-color:rgba(236,231,222,.3);text-underline-offset:4px}

/* Bottom bar */
.foot{position:fixed;left:32px;right:32px;bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;z-index:5;pointer-events:none}
.legend{display:flex;gap:16px;align-items:center;font-size:.78rem;color:var(--muted);pointer-events:auto;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:18px;height:3px;border-radius:2px;display:block}
.legend .fine{color:var(--dim)}
.ctrls{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(13,13,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(236,231,222,.16);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;color:var(--muted);transition:color .2s,border-color .2s,background .2s}
.chip:hover{color:var(--bone);border-color:rgba(236,231,222,.4)}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--bone);border-color:var(--bone)}
.group{display:flex;gap:2px;background:rgba(13,13,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(236,231,222,.16);border-radius:999px;padding:3px}
.group .chip{border:0;background:transparent;padding:5px 11px;backdrop-filter:none}
.group .chip[aria-pressed="true"]{background:var(--bone);color:var(--ink)}

/* Card */
.card{position:fixed;right:32px;top:76px;width:340px;background:rgba(13,13,12,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(236,231,222,.14);border-radius:16px;padding:22px 22px 20px;z-index:6;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .35s,transform .35s}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;padding:6px}
.card .x:hover{color:var(--bone)}
.card .k{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.card h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.75rem;line-height:1.02;margin-top:8px;padding-right:20px}
.card .line{color:#cfc9be;margin-top:10px;font-size:.96rem;line-height:1.45}
.card dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(236,231,222,.12)}
.card dt{font-size:.74rem;color:var(--dim)}
.card dd{font-size:1.02rem;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.card .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font:500 .9rem var(--sans);cursor:pointer;border:1px solid var(--bone);background:var(--bone);color:var(--ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--bone);border-color:rgba(236,231,222,.3)}
.btn.ghost:hover{border-color:var(--bone)}
.btn:hover{background:var(--s2);border-color:var(--s2);color:var(--ink)}
.cat{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:3px;color:var(--ink)}
.rwbar{margin-top:16px;display:flex;align-items:center;gap:14px}
.rwbar svg{flex:none}

/* Follow banner */
.follow{position:fixed;left:50%;top:26px;transform:translate(-50%,-10px);background:rgba(13,13,12,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(236,231,222,.16);border-radius:999px;padding:8px 10px 8px 16px;font-size:.88rem;display:flex;align-items:center;gap:12px;z-index:6;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.follow.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.follow i{width:7px;height:7px;border-radius:50%;background:var(--s1);display:block}
.follow button{background:var(--bone);color:var(--ink);border:0;border-radius:999px;padding:5px 12px;font:500 .82rem var(--sans);cursor:pointer}
body.following .hud h1,body.following .hud .sum,body.following .hud .stats{opacity:0;transition:opacity .5s}
.hud h1,.hud .sum,.hud .stats{transition:opacity .5s}

/* Scene popover */
.scene{position:relative}
.pop{position:absolute;right:0;bottom:calc(100% + 10px);background:rgba(13,13,12,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(236,231,222,.16);border-radius:14px;padding:14px;display:none;gap:12px;flex-direction:column;min-width:330px}
.pop.on{display:flex}
.pop .row{display:flex;flex-direction:column;gap:6px}
.pop .row > span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pop .group{background:transparent;border:0;padding:0;backdrop-filter:none;flex-wrap:wrap}
.pop .toggles{display:flex;flex-wrap:wrap;gap:6px}
.pop{min-width:360px;max-width:380px}
.menu-btn{display:inline-flex;align-items:center;gap:8px;color:var(--bone)!important}

/* Explore panel */
.open-panel{z-index:5}
.open-panel .chip{color:var(--bone);border-color:rgba(236,231,222,.3);padding:9px 15px;font-size:.88rem}
.open-panel .chip b{color:var(--s2);font-weight:500}
.panel{position:fixed;right:20px;top:20px;bottom:86px;width:380px;z-index:6;background:rgba(13,13,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(236,231,222,.14);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .35s,transform .35s}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(var(--s1) 0 2px,var(--s2) 2px 4px,var(--s3) 4px 6px)}
.panel .tabs{display:flex;gap:2px;padding:20px 44px 0 14px;flex-wrap:wrap}
.panel .tabs button{background:none;border:0;cursor:pointer;font:500 .92rem var(--sans);color:var(--muted);padding:6px 10px;border-radius:999px}
.panel .tabs button[aria-selected="true"]{background:var(--bone);color:var(--ink)}
.panel .x{position:absolute;right:12px;top:14px;background:none;border:0;font-size:1.4rem;color:var(--muted);cursor:pointer;padding:6px}
.panel .pbody{overflow-y:auto;padding:18px 22px 22px;flex:1}
.panel h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.9rem;line-height:1}
.panel .when{font-size:.8rem;color:var(--muted);margin-top:8px}
.panel .intro2{color:#cfc9be;margin-top:12px;font-size:.95rem;line-height:1.5}
.rank{list-style:none;margin-top:16px;border-top:1px solid rgba(236,231,222,.12)}
.rank li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(236,231,222,.08);cursor:pointer}
.rank li:hover .nm{color:var(--s2)}
.rank .n{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
.rank .nm{font-weight:500;font-size:.98rem;transition:color .2s}
.rank .sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.rank .bar{height:3px;border-radius:2px;margin-top:7px;background:linear-gradient(90deg,var(--s1),var(--s2))}
.rank .ct{text-align:right;font-variant-numeric:tabular-nums}
.rank .ct b{display:block;font-size:1.15rem;font-weight:600}
.rank .ct span{font-size:.74rem;color:var(--muted)}
.spot-k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--s2)}
.note2{font-size:.85rem;color:var(--muted);margin-top:12px;line-height:1.5;padding:10px 12px;border-left:2px solid var(--s1);background:rgba(232,105,44,.06)}
.rank .up{color:#7fbf8a}.rank .dn{color:#e0645a}
.report p{color:#cfc9be;font-size:.98rem;line-height:1.6;margin-top:14px}
.report p b{color:var(--bone);font-weight:500}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:18px;padding:16px 0;border-top:1px solid rgba(236,231,222,.12);border-bottom:1px solid rgba(236,231,222,.12)}
.rstats b{display:block;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.rstats span{font-size:.76rem;color:var(--muted)}
.sample{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border:1px solid rgba(236,231,222,.18);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:3px}
body.panel-open .card{right:416px}
body.panel-open .open-panel{opacity:0;pointer-events:none}
@media (max-width:760px){
  .open-panel .chip{padding:6px 11px;font-size:.78rem}
  .open-panel .lg{display:none}
  .panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;height:72vh}
  body.panel-open .card{right:12px}
  .pop{right:auto;left:0;min-width:0;width:calc(100vw - 40px)}
}

.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,8px);background:rgba(13,13,12,.88);border:1px solid rgba(236,231,222,.18);border-radius:999px;padding:9px 16px;font-size:.86rem;z-index:9;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.chart .vig{background:linear-gradient(to right,rgba(13,13,12,.92) 0,rgba(13,13,12,.75) 30%,transparent 46%),linear-gradient(to top,rgba(13,13,12,.85),transparent 20%)}
@media (max-width:760px){body.chart .vig{background:linear-gradient(to bottom,rgba(13,13,12,.94),rgba(13,13,12,.8) 32%,transparent 46%),linear-gradient(to top,rgba(13,13,12,.94) 10%,transparent 34%)}}
.cls{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:3px;border:1px solid rgba(236,231,222,.4);color:var(--bone)}
.freq{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.88rem;color:#cfc9be}
.freq b{color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}

/* Home airport */
.topright{position:fixed;right:32px;top:30px;z-index:5;display:flex;gap:8px;align-items:flex-start}
.topright .open-panel{position:static}
.home{position:relative}
.home-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(13,13,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(236,231,222,.16);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--muted);font:400 .82rem var(--sans);white-space:nowrap}
.home-pill:hover{color:var(--bone);border-color:rgba(236,231,222,.4)}
.home-pill b{color:var(--s2);font-weight:600}
.home-pill .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.home-pill .hw{color:#cfc9be;font-variant-numeric:tabular-nums}
.home-form{display:none;position:absolute;right:0;top:calc(100% + 8px);background:rgba(13,13,12,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(236,231,222,.18);border-radius:14px;padding:12px;gap:8px;width:260px;flex-direction:column}
.home-form.on{display:flex}
.home-form label{font-size:.76rem;color:var(--muted)}
.home-form input{font:500 1rem var(--sans);padding:9px 12px;border-radius:10px;border:1px solid rgba(236,231,222,.25);background:rgba(236,231,222,.06);color:var(--bone);text-transform:uppercase}
.home-form input:focus{outline:none;border-color:var(--s2)}
.home-form .row{display:flex;gap:6px}
.home-form .msg{font-size:.78rem;color:var(--muted);min-height:1em}
body.panel-open .topright{opacity:0;pointer-events:none}
@media (max-width:760px){
  .topright{right:16px;top:18px;gap:6px}
  .home-pill{padding:6px 10px;font-size:.76rem}
  .home-pill .hw{display:none}
  .home-form{width:calc(100vw - 32px);right:-0px}
}

/* Modes */
.modes{pointer-events:auto;display:flex;gap:2px;background:rgba(13,13,12,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(236,231,222,.18);border-radius:999px;padding:4px}
.modes button{background:none;border:0;cursor:pointer;font:500 .9rem var(--sans);color:var(--muted);padding:8px 16px;border-radius:999px;transition:background .2s,color .2s}
.modes button:hover{color:var(--bone)}
.modes button[aria-pressed="true"]{background:var(--bone);color:var(--ink)}
body.mode-plan .ticker,body.mode-look .ticker{opacity:0;pointer-events:none}
body.mode-plan .hud .stats,body.mode-look .hud .stats,body.mode-plan .hud .sum,body.mode-look .hud .sum{opacity:0;pointer-events:none}
body.mcard-hide .mcard{opacity:0;pointer-events:none}
.mcard{position:fixed;right:32px;top:76px;width:380px;max-height:calc(100vh - 170px);overflow-y:auto;z-index:6;background:rgba(13,13,12,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(236,231,222,.14);border-radius:16px;padding:20px 20px 18px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .35s,transform .35s;overflow:hidden}
.mcard.on{opacity:1;transform:none;pointer-events:auto}
.mcard:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(var(--s1) 0 2px,var(--s2) 2px 4px,var(--s3) 4px 6px)}
.mcard h3{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.5rem;line-height:1.05}
.mcard .k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--s2)}
.mcard p{color:#cfc9be;font-size:.93rem;line-height:1.5;margin-top:8px}
.mcard .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(236,231,222,.12)}
.mcard .rings b{display:block;font-size:1.15rem;font-weight:600}
.mcard .rings span{font-size:.74rem;color:var(--muted)}
.mcard .spd{display:flex;gap:4px;margin-top:12px;align-items:center;font-size:.78rem;color:var(--muted)}
.mcard .spd button{background:none;border:1px solid rgba(236,231,222,.2);color:var(--muted);border-radius:999px;padding:4px 10px;font:500 .78rem var(--sans);cursor:pointer}
.mcard .spd button[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.mcard dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(236,231,222,.12)}
.mcard dt{font-size:.72rem;color:var(--dim)}
.mcard dd{font-size:.98rem;font-weight:500;margin-top:2px}
.mcard .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mcard ul{list-style:none;margin-top:10px}
.mcard li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(236,231,222,.1);font-size:.92rem;cursor:pointer}
.mcard li:hover b{color:var(--s2)}
.mcard li .t{font-weight:600;color:var(--s2);font-variant-numeric:tabular-nums}
.mcard li b{font-weight:500;color:var(--bone)}
.mcard li span{color:var(--muted)}
.mcard .now{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(232,105,44,.14);border:1px solid rgba(232,105,44,.4);color:var(--bone);font-size:.95rem}
.mcard .fine2{font-size:.75rem;color:var(--dim);margin-top:12px}
@media (max-width:760px){
  .mcard{left:10px;right:10px;width:auto;top:auto;bottom:66px;max-height:46vh}
  body .foot{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
  .modes button{padding:7px 12px;font-size:.84rem}
  .foot{flex-direction:row;align-items:center;justify-content:space-between}
  .menu-btn .mlbl{display:none}
  .ticker{bottom:70px}
}

/* Brand stripe */
.topstripe{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;flex-direction:column;pointer-events:none}
.topstripe i,.stripe i{display:block;height:3px}
.topstripe i:nth-child(1),.stripe i:nth-child(1){background:var(--s1)}
.topstripe i:nth-child(2),.stripe i:nth-child(2){background:var(--s2)}
.topstripe i:nth-child(3),.stripe i:nth-child(3){background:var(--s3)}
.hud .stripe{display:flex;flex-direction:column;width:64px;margin-top:10px}
.hud .stripe i{height:2px}
.card{overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(var(--s1) 0 2px,var(--s2) 2px 4px,var(--s3) 4px 6px)}

/* Load-in: a small plane trailing the stripe, then the screen splits open */
.splash{position:fixed;inset:0;z-index:100;cursor:pointer}
.splash.gone{display:none}
.splash .bg{position:absolute;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center}
.splash .wm2{font-family:"Calogen Exp",var(--display);font-style:italic;font-weight:700;font-size:1.7rem;letter-spacing:.01em;color:var(--bone);display:flex}
.splash .wm2 span{display:inline-block;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*60ms + 120ms)}
.splash.on .wm2 span{opacity:1;transform:none}
.splash.on .wm2{animation:wmDrift 3.4s ease-out both}
@keyframes wmDrift{from{transform:scale(.95);letter-spacing:.06em}to{transform:scale(1.04);letter-spacing:.01em}}
.splash svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.splash polyline{fill:none;stroke-linejoin:round;stroke-linecap:butt}
.splash .pl{fill:var(--bone)}
.splash.split > .bg,.splash.split > svg{visibility:hidden}
.splash .half{position:absolute;inset:0;transition:transform .9s cubic-bezier(.7,0,.25,1);will-change:transform}

@media (max-width:760px){
  .hud{left:20px;top:20px}
  .hud h1{margin-top:16px;font-size:2.1rem}
  .hud .sum{font-size:.92rem;margin-top:10px;line-height:1.4}
  .hud .stats{gap:16px;margin-top:12px}
  .hud .stat b{font-size:1.2rem}
  .ticker{left:20px;right:20px;bottom:70px}
  .ticker button{font-size:1rem}
  .foot{left:20px;right:20px;bottom:18px;flex-direction:column;align-items:flex-start;gap:12px}
  .ctrls{justify-content:flex-start}
  .legend{display:none}
  .card{left:12px;right:12px;top:auto;bottom:12px;width:auto;transform:translateY(20px)}
  .card.on{transform:none}
  .follow{top:64px;bottom:auto;max-width:calc(100vw - 32px)}
}
@media (prefers-reduced-motion:reduce){.splash .wm2 span{transition:none}.splash.on .wm2{animation:none}}
</style>

  var sn=Object.keys(SN), rn=Object.keys(RN).filter(function(r){return !SN[r];});
  good=good.filter(function(r){return !SN[r]&&!RN[r];});

  else { if(good.length) out.push("Clear skies over "+list(good)+"."); if(meh.length) out.push("Lower clouds hanging over "+list(meh)+"."); if(bad.length) out.push("Instrument weather in "+list(bad)+"."); }

  ws.forEach(function(s){ var r=s.w.dir*Math.PI/180; u+=Math.sin(r); v+=Math.cos(r); sp.push(s.w.spd); });
  if(ws.length){ var dir=(Math.atan2(u,v)*180/Math.PI+360)%360; sp.sort(function(a,b){return a-b;}); var lo=sp[Math.floor(sp.length*.2)], hi=sp[Math.floor(sp.length*.85)];
    out.push("Wind mostly from the "+cardinal(dir)+", "+lo+" to "+hi+" knots."); }

}

window.upwindSky={mode:setMode,look:function(la,lo){setLook(la,lo);},trip:function(id){ trip={dest:{lat:A[id].lat,lon:A[id].lon,name:code(A[id])+' '+A[id].t,apt:A[id]}}; renderTrip(); },setHome:function(id){setHome(A[id]);},openLake:function(){ var p=planes.filter(function(p){return SMALL[p.kind]&&!p.orb&&where(p).lake;})[0]; if(p) openPlane(p); return p&&p.name; },openSpot:function(i){openSpot(SPOTS[i]);},openCrossing:function(i){openCrossing(XING[i]);},openAirport:function(id){openAirport(A[id]);},openPanel:openPanel,tab:function(t){tab=t;renderPanel();}};
updLight(); size(); seedParticles(); headline(); stats();
addEventListener("resize",function(){ size(); seedParticles(); });
// warm up trails
for(var i=0;i<60;i++) movePlanes(0.12);
requestAnimationFrame(function(t){ last=t; requestAnimationFrame(frame); });
setInterval(stats,2000);
nextMoment(); setInterval(nextMoment,7000);
liveNote(); pollTraffic(); pollWeather();
// Load-in
var splash=document.getElementById("splash"), spT, spRaf;
function endSplash(){ clearTimeout(spT); cancelAnimationFrame(spRaf); splash.classList.add("gone"); splash.classList.remove("on","split"); splash.querySelectorAll(".half").forEach(function(h){h.remove();}); }
function playSplash(){
  clearTimeout(spT); cancelAnimationFrame(spRaf);
  var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  splash.querySelectorAll(".half").forEach(function(h){h.remove();});
  splash.classList.remove("gone","on","split"); void splash.offsetWidth; splash.classList.add("on");
  var Wd=innerWidth, Hd=innerHeight, band=3;
  var wmR=splash.querySelector(".wm2").getBoundingClientRect(), yU=Math.round(wmR.bottom+22)+0.5;
  var svgRoot=d3.select("#splash-svg"); svgRoot.selectAll("*").remove(); var gEl=svgRoot.append("g");
  var cols=["#e8692c","#f2a33a","#f4e2c6"], x0=-90, x1=Wd+90, L=x1-x0;
  var lines=cols.map(function(c){ return gEl.append("polyline").attr("stroke",c).attr("stroke-width",band+0.6); });
  var plane=gEl.append("path").attr("class","pl").attr("d","M0,-13 C1.6,-13 2.3,-9 2.3,-5 L13,2 L13,5 L2.3,2 L1.6,9 L5.5,12 L5.5,14 L0,12.5 L-5.5,14 L-5.5,12 L-1.6,9 L-2.3,2 L-13,5 L-13,2 L-2.3,-5 C-2.3,-9 -1.6,-13 0,-13 Z");
  function draw(p){
    var x=x0+L*p;
    lines.forEach(function(ln,k){ var y=yU+(k-1)*band; ln.attr("points",x0+","+y+" "+x.toFixed(1)+","+y); });
    plane.attr("transform","translate("+x.toFixed(1)+","+yU+") rotate(90)");
  }
  function finish(){
    if(still){ spT=setTimeout(endSplash,700); return; }
    spT=setTimeout(function(){
      plane.style("display","none");
      var bgEl=splash.querySelector(".bg"), svgN=document.getElementById("splash-svg");
      var halves=[["0 0 "+(Hd-yU)+"px 0",-(yU+band*2)],[yU+"px 0 0 0",(Hd-yU)+band*2]].map(function(c){
        var h=document.createElement("div"); h.className="half"; h.style.clipPath="inset("+c[0]+")";
        var b2=bgEl.cloneNode(true), s2=svgN.cloneNode(true); s2.removeAttribute("id");
        h.appendChild(b2); h.appendChild(s2); splash.appendChild(h); h.dataset.to=c[1]; return h;
      });
      splash.classList.add("split"); void splash.offsetWidth;
      halves.forEach(function(h){ h.style.transform="translateY("+h.dataset.to+"px)"; });
      d3.select(cTop).call(zoom.transform,d3.zoomIdentity.translate(Wd*0.03,Hd*0.02).scale(0.95));
      var tgt=d3.zoomIdentity; if(home){ var hb=proj([home.lon,home.lat]), hk=1.9; tgt=d3.zoomIdentity.translate((mobile?W/2:W*0.62)-hb[0]*hk,(mobile?H*0.56:H/2)-hb[1]*hk).scale(hk); }
      d3.select(cTop).transition().duration(2400).ease(d3.easeCubicOut).call(zoom.transform,tgt);
      spT=setTimeout(endSplash,950);
    },320);
  }
  if(still){ draw(1); spT=setTimeout(finish,1000); return; }
  var dur=2100, t0=performance.now()+450;
  (function step(now){ var t=Math.max(0,Math.min(1,(now-t0)/dur)), p=1-Math.pow(1-Math.pow(t,1.5),2.2); draw(p);
    if(t<1) spRaf=requestAnimationFrame(step); else { draw(1); finish(); } })(performance.now());
}
splash.addEventListener("click",endSplash);
document.getElementById("wm").addEventListener("click",function(e){ e.preventDefault(); if(follow) stopFollow(); closeCard(); playSplash(); });
if(document.visibilityState==="visible") playSplash();
else document.addEventListener("visibilitychange",function once(){ if(document.visibilityState==="visible"){ document.removeEventListener("visibilitychange",once); playSplash(); } });
})();
</script>
